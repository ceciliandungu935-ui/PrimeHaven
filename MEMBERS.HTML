<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MEMBER PAGE</title>

<link rel="stylesheet" href="bootstrap/css/bootstrap.min.css">
<script src="bootstrap/js/bootstrap.min.js"></script>
</head>
<body>
    
<h1 class="text-center text-justify mb-3">New Member Registration</h1>

<form action="" class="bg-secondary m-5 p-5">

<div class="mb-4">
    <label for="fname" class="form-check-label">Full Name</label>
    <input type="text" id="fname" class="form-control"  placeholder="e.g Inezza Avilla" required>
</div>

<div class="mb-4">
    <label for="email" class="form-check-label">Email Address</label>
    <input type="text" id="email" class="form-control"  placeholder="e.g xyz@gmail.com" required>
</div>


<div class="mb-4">
    <label for="address" class="form-check-label">Address</label>
    <input type="number" id="address" class="form-control" placeholder="e.g 090876" required>                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                               " required>
</div>

<div class="mb-4">
    <label for="phone" class="form-check-label">Phone Number</label>
    <input type="tel" id="phone" class="form-control"  placeholder="e.g +254786767983" required>
</div>

<div>
    <button type="submit" class="btn btn-dark">Submit</button>
</div>

</form>



</body>
</html>
